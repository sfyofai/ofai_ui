name: SFY UI CI 
on: 
 push:
  branches:
    - main
 pull_request:
  branches:
    - main

env:
  repo_name: "shahfaisalyezdani"   

jobs:
  test:
    runs-on: [ self-hosted, os=linux]

    outputs:
      SHORT_SHA: ${{steps.version.outputs.SHORT_SHA}}


    steps:
      - name : Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node js
        uses: actions/setup-node@v4
        with: 
          node-version: 24
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{runner.os}}-npm-${{ hashFiles('package-lock.json') }}

      - name: Get short commit SHA
        id: version
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
    

  build:
    runs-on: [self-hosted, os=windows]
    needs: test
    steps:
      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Docker build and publish
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.repo_name }}/${{ github.event.repository.name }}:${{ needs.test.outputs.SHORT_SHA }}



  