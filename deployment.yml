apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfyapp
  labels:
    app: sfyui

spec: 
  replicas: 2
  selector:
    matchLabels:
      app: sfyui
  
  template:
    metadata:
      labels:
        app: sfyui
    spec:
      containers:
        - name : sfyui-app
          image: sfyimage
          imagePullPolicy: Always
          ports:
            - containerPort: 5000






